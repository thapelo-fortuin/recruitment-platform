server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/api/v1/auth/**
            - id: auth-service-health
              uri: http://auth-service:8081
              predicates:
                - Path=/actuator/**
            - id: job-service
              uri: http://job-service:8082
              predicates:
                - Path=/api/v1/jobs/**
            - id: application-service
              uri: http://application-service:8083
              predicates:
                - Path=/api/v1/applications/**
            - id: soc-admin
              uri: http://soc-service:8084
              predicates:
                - Path=/api/v1/soc/**
              filters:
                - RewritePath=/api/v1/soc/(?<segment>.*), /api/v1/$\{segment}

jwt:
  secret: this-is-a-development-secret-key-change-it-later-1234567890
  expiration-ms: 3600000
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
