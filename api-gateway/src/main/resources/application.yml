server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

jwt:
  secret: this-is-a-development-secret-key-change-it-later-1234567890
  expiration-ms: 3600000